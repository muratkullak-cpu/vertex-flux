<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VERTEX Cep">

<title>VERTEX Cep</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" href="ikon-192.png">
<style>
:root{--bg:#0f1116;--card:#1a1d25;--line:#2a2e39;--fg:#f2f4f8;--mut:#9aa3b5;--acc:#F5C400;--blue:#3E8BFF;--red:#ff6b6b;--ok:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px}
header{display:flex;align-items:center;gap:12px;padding:10px 0 14px}
header img{width:44px;height:40px;object-fit:contain}
header b{font-size:19px;letter-spacing:.03em}
header small{display:block;color:var(--mut);font-size:12px}
h2{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.mut{color:var(--mut);font-size:14px}
.big{font-size:22px;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--red)}
button,.btn{font:inherit;border:0;border-radius:14px;padding:14px 16px;background:#2a2f3c;color:var(--fg);font-weight:600;width:100%;cursor:pointer}
button.pri{background:var(--acc);color:#14161c}
button.blue{background:var(--blue);color:#fff}
button.sm{width:auto;padding:10px 14px;font-size:15px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:#10131a;border:1px solid var(--line);border-radius:12px;padding:13px}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#10131a;color:var(--mut);font-weight:600;font-size:15px}
.chip.on{background:var(--acc);color:#14161c;border-color:var(--acc)}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:#2a2f3c;color:var(--mut)}
canvas.prev{width:100%;height:auto;border-radius:12px;background:#fff;display:block}
.top{display:flex;gap:8px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:14px;font-weight:600;z-index:9;max-width:90%;text-align:center}
</style>
</head>

try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Kaydedilemedi: depolama dolu/kapalı"); } };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const para = (n) => (Math.round(n * 100) / 100).toLocaleString("tr-TR", { minimumFractionDigits: Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2, maximumFractionDigits: 2 }) + " TL";
const bugun = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const tr = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? m[3] + "." + m[2] + "." + m[1] : ""; };
const num = (v) => { const s = String(v == null ? "" : v).trim().replace(/\s/g, "").replace(/TL|₺/gi, ""); if (!s) return NaN; const t = /,\d{1,2}$/.test(s) ? s.replace(/\./g, "").replace(",", ".") : s.replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."); return parseFloat(t); };
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const bak = (m, upto) => { let b = 0; (m.hareketler || []).forEach((h, i) => { if (upto !== undefined && i > upto) return; b += h.t === "odeme" ? h.tutar : -h.tutar; }); return Math.round(b * 100) / 100; };
const bakCls = (b) => (b < 0 ? "neg" : "pos");

/* ---------- ekranlar ---------- */
let V = { ekran: "ana" }, form = {};
function go(e, p) { V = Object.assign({ ekran: e }, p || {}); form = {}; render(); window.scrollTo(0, 0); }
function head() { return `<header><img src="${LOGO}" alt=""><div><b>VERTEX Cep</b><small>Tahsilat · Bilgilendirme · Bakiye</small></div><span class="sp"></span>${V.ekran !== "ana" ? `<button class="sm ghost" data-go="ana">‹ Ana</button>` : ""}</header>`; }
function render() { const a = $("#app"); a.innerHTML = head() + (V.ekran === "ana" ? ana() : V.ekran === "musteri" ? musteri() : V.ekran === "odeme" ? odemeForm() : V.ekran === "is" ? isForm() : V.ekran === "belge" ? belge() : V.ekran === "yedek" ? yedek() : V.ekran === "yeni" ? yeni() : ""); if (V.ekran === "belge") cizBelge(); }
function ana() {
  const L = S.musteriler;
  return `<div class="grid2" style="margin-bottom:12px"><button class="pri" data-go="odeme">＋ Ödeme aldım</button><button class="blue" data-go="is">✓ İş yaptım</button></div>

  <button class="ghost" data-go="yedek" style="margin-top:8px">Yedek al / geri yükle</button>
  <p class="mut" style="text-align:center">Veriler bu cihazda saklanır, internet ya da Claude gerekmez.</p>`;
}
function yeni() {
  return `<h2>Yeni müşteri</h2><div class="card"><label>Ad soyad / işletme</label><input id="f-ad" autocomplete="off"><label>WhatsApp numarası (isteğe bağlı)</label><input id="f-tel" inputmode="tel" placeholder="05xx xxx xx xx"><label>Not (isteğe bağlı)</label><input id="f-not"></div><button class="pri" data-act="musteriKaydet">Kaydet</button>`;
}
function musteri() {
